name: macOS validation and preview
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run check
      - run: node --test tests/update-flow.test.cjs
      - run: cargo test -p assistant-core --locked
      - run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app --config '{"bundle":{"active":true}}'
      - name: Preserve application permissions and framework links
        run: tar -czf claude-cn-assistant-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release/bundle/macos .
      - uses: actions/upload-artifact@v4
        with:
          name: claude-cn-assistant-macos-${{ matrix.target }}-unsigned-preview
          path: claude-cn-assistant-${{ matrix.target }}.tar.gz
          if-no-files-found: error
