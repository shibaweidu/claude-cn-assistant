<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f8f7f4"><title>Claude Desktop 汉化助手</title><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <a class="brand" href="#overview" aria-label="Claude Desktop 汉化助手"><span class="brand-mark">c<span>n</span></span><span>Claude Desktop<br>汉化助手<small>让每一次打开，都更顺手</small></span></a>
    <div class="nav-caption">工作空间</div>
    <nav aria-label="主导航">
      <button data-page="overview" class="nav-item active"><span data-icon="home"></span>概览<span class="nav-shortcut">⌘ 1</span></button>
      <button data-page="downloads" class="nav-item"><span data-icon="download"></span>下载与更新<span class="nav-dot"></span></button>
      <button data-page="localization" class="nav-item"><span data-icon="language"></span>界面汉化</button>
      <button data-page="recovery" class="nav-item"><span data-icon="history"></span>备份与恢复</button>
      <a class="nav-item kaola-nav" href="https://www.appkaola.com" target="_blank" rel="noopener noreferrer" aria-label="KAOLA API，一站式顶级大模型调用平台，打开外部网站"><span data-icon="external"></span><span class="kaola-copy">KAOLA API<small>一站式顶级大模型调用平台</small></span></a>
    </nav>
    <div class="sidebar-bottom"><div class="local-card"><span class="status-dot"></span><div>本地优先<small>你的配置，留在你的电脑</small></div><span data-icon="shield"></span></div><button data-page="settings" class="nav-item"><span data-icon="settings"></span>偏好设置</button><div class="sidebar-version"><span>汉化助手</span><span>v0.2.0</span></div></div>
  </aside>
  <div class="workspace">
    <header class="toolbar"><div class="breadcrumb">工作空间<span>/</span><strong id="crumb">概览</strong></div><div class="toolbar-right"><span class="preview-label">交互预览</span><button class="icon-button" id="theme-button" aria-label="切换深浅外观"><span data-icon="sun"></span></button><a class="icon-button" href="https://github.com/Wangnov/claude-app-mirror" target="_blank" rel="noreferrer" aria-label="查看镜像项目"><span data-icon="github"></span></a></div></header>
    <main id="content"></main>
    <footer><span><i class="status-dot"></i>所有操作均在本地执行</span><span>为更熟悉的 Claude 而作</span></footer>
  </div>
</div>
<div id="toast" role="status"></div>
<dialog id="modal"><div id="modal-content"></div></dialog>
<script type="module" src="app.js"></script>
</body></html>
